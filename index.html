<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALsoftrix</title>
    <meta name="description" content="ALsoftrix - Mobile apps by Mohamed Al Asfak Alaseer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(200, 168, 78, 0.06) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            text-align: center;
            z-index: 1;
            position: relative;
        }

        /* Brand wrapper for fade-in */
        .brand-wrapper {
            opacity: 0;
            animation: fadeGlowIn 2s ease-out 0.5s forwards;
            filter: drop-shadow(0 0 30px rgba(200, 168, 78, 0.3));
        }

        /* Brand name — solid gold base */
        .brand {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 700;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            display: inline-block;
            position: relative;
            color: #C8A84E;
            -webkit-text-fill-color: #C8A84E;
        }

        /* Shine overlay clipped to text */
        .brand::after {
            content: 'ALsoftrix';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                105deg,
                transparent 0%,
                transparent 30%,
                rgba(255, 248, 220, 0.8) 45%,
                rgba(255, 255, 255, 1) 50%,
                rgba(255, 248, 220, 0.8) 55%,
                transparent 70%,
                transparent 100%
            );
            background-size: 50% 100%;
            background-repeat: no-repeat;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0;
            animation: shineMove 6s linear 3s infinite;
            pointer-events: none;
        }

        @keyframes shineMove {
            0% {
                opacity: 1;
                background-position: -200% center;
            }
            55% {
                opacity: 1;
                background-position: 300% center;
            }
            55.01%, 100% {
                opacity: 0;
                background-position: -200% center;
            }
        }

        @keyframes fadeGlowIn {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin: 28px auto;
            opacity: 0;
            animation: fadeIn 1.5s ease-out 1.8s forwards;
        }

        .divider-line {
            width: 0;
            height: 1px;
            animation: lineGrow 1.5s ease-out 2s forwards;
        }

        .divider-line.left {
            background: linear-gradient(90deg, transparent, #C8A84E);
        }

        .divider-line.right {
            background: linear-gradient(90deg, #C8A84E, transparent);
        }

        .diamond {
            width: 8px;
            height: 8px;
            background: #C8A84E;
            transform: rotate(45deg);
            flex-shrink: 0;
            box-shadow: 0 0 10px rgba(200, 168, 78, 0.5);
        }

        /* Developer name */
        .developer {
            font-size: clamp(0.7rem, 2.5vw, 1rem);
            font-weight: 300;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(200, 168, 78, 0.6);
            opacity: 0;
            animation: fadeIn 2s ease-out 2.8s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes lineGrow {
            from { width: 0; }
            to { width: clamp(80px, 20vw, 160px); }
        }

        @media (max-width: 480px) {
            .brand {
                letter-spacing: 0.25em;
            }
            .developer {
                letter-spacing: 0.2em;
                padding: 0 20px;
            }
        }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>
    <div class="bg-glow"></div>

    <div class="container">
        <div class="brand-wrapper">
            <h1 class="brand">ALsoftrix</h1>
        </div>

        <div class="divider">
            <div class="divider-line left"></div>
            <div class="diamond"></div>
            <div class="divider-line right"></div>
        </div>

        <p class="developer">Mohamed Al Asfak Alaseer</p>
    </div>

    <script>
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let w, h;

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }

        function createParticle() {
            return {
                x: Math.random() * w,
                y: Math.random() * h,
                size: Math.random() * 1.5 + 0.5,
                speedY: -(Math.random() * 0.3 + 0.1),
                speedX: (Math.random() - 0.5) * 0.2,
                opacity: Math.random() * 0.4 + 0.1,
                fadeDir: Math.random() > 0.5 ? 1 : -1,
                fadeSpeed: Math.random() * 0.005 + 0.002
            };
        }

        function init() {
            resize();
            particles = [];
            const count = Math.min(60, Math.floor(w * h / 15000));
            for (let i = 0; i < count; i++) {
                particles.push(createParticle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, w, h);
            particles.forEach((p, i) => {
                p.x += p.speedX;
                p.y += p.speedY;
                p.opacity += p.fadeDir * p.fadeSpeed;
                if (p.opacity >= 0.5) p.fadeDir = -1;
                if (p.opacity <= 0.05) p.fadeDir = 1;
                if (p.y < -10 || p.x < -10 || p.x > w + 10) {
                    particles[i] = createParticle();
                    particles[i].y = h + 10;
                }
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(200, 168, 78, ${p.opacity})`;
                ctx.fill();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        init();
        animate();
    </script>
</body>
</html>
